aid: dayuse
name: Dayuse
description: 'Dayuse is a global online marketplace for daytime hotel bookings, letting travelers
  reserve 3-to-5-star hotel rooms by the hour or for a microstay during the day rather than for an
  overnight stay, at discounts of up to 75% off the nightly rate. Founded in France in 2010, the
  platform connects consumers with more than 9,000 partner hotels across roughly 29 countries, with
  use cases spanning remote work, layovers, wellness and spa access, and privacy. Hoteliers join
  through the Dayuse partner network and manage daytime inventory via the partner portal. Dayuse is
  backed by Partech and is tracked in the API Evangelist network as a company profile; no public
  developer API is currently published, so this profile captures identity, partner surface, and
  domain-security posture only.'
